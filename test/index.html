<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <script src="/dist/index.js"></script>
</head>
<body>
<x-container collapsible="false">
    <x-box color="primary" variant="solid" slot="header">
        <x-text variant="title">Title 区块主标题</x-text>
    </x-box>
    <div slot="sidebar" style="padding:0">
        <x-box>
            <x-logo mark="X" title="Xie-ui" subtitle="Admin"></x-logo>
        </x-box>
        <x-menu>
            <x-menu-group label="概览" collapsible>
                <x-menu-item value="dash">仪表盘</x-menu-item>
                <x-menu-item value="stat">数据统计</x-menu-item>
            </x-menu-group>
        </x-menu>
    </div>

    <x-box>
        <x-flex direction="column">
            <x-tabs variant="pills">
                <x-tab value="a">资料</x-tab>
                <x-tab value="b">设置</x-tab>
                <x-tab value="c">关于</x-tab>
            </x-tabs>

            <x-breadcrumb separator="chevron" max-items="3" label="订单路径">
                <x-breadcrumb-item href="/">工作台</x-breadcrumb-item>
                <x-breadcrumb-item href="/orders">订单管理</x-breadcrumb-item>
                <x-breadcrumb-item href="/orders/9527">订单详情</x-breadcrumb-item>
                <x-breadcrumb-item href="/refund">退款审批</x-breadcrumb-item>
                <x-breadcrumb-item>审批记录</x-breadcrumb-item>
            </x-breadcrumb>

            <x-count-up trigger="visible" value="87654"></x-count-up>

            <x-collapse>
                <span slot="trigger"><x-icon name="settings"></x-icon><b>高级设置</b></span>
                <div class="自己包的边框底色">构建产物默认输出到 dist/……</div>
            </x-collapse>

            <x-button id="btn-evt" variant="solid">点我</x-button>
            <span id="btn-evt-status">点击按钮查看事件</span>
<script>
    document.querySelector("#btn-evt").addEventListener("x-click", (e) => {
        const d = e.detail;
        document.querySelector("#btn-evt-status").textContent = "x-click → id=" + d.id + " value=" + d.value + " selected=" + d.selected;
    });
</script>
        </x-flex>
    </x-box>
</x-container>
</body>
</html>
