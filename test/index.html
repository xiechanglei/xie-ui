<!doctype html>
<html data-xie-theme="dark" data-xie-radius="none" data-xie-size="compact" data-xie-shadow="strong">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <script type="module" src="/dist/index.js"></script>
</head>
<body>
<x-input type="date"></x-input>

<h3>x-form 校验/提交（horizontal + footer label-offset）</h3>
<x-form id="t" layout="horizontal" label-width="90px" label-align="end">
  <x-form-item label="账号" name="acc" required><x-input name="acc"></x-input></x-form-item>
  <x-form-item label="邮箱" name="mail" required help="需合法邮箱"><x-input name="mail" type="email"></x-input></x-form-item>
  <x-form-item label="城市" name="city"><x-select name="city" options="北京,上海,广州"></x-select></x-form-item>
  <x-form-item label="订阅" name="sub"><x-switch name="sub"></x-switch></x-form-item>
  <x-form-footer label-offset align="end">
    <x-button id="submit">提交</x-button>
    <x-button id="reset" variant="outline">重置</x-button>
  </x-form-footer>
</x-form>
<pre id="out"></pre>
<script type="module">
  const f = document.getElementById('t');
  const out = document.getElementById('out');
  document.getElementById('submit').addEventListener('click', () => f.submit());
  document.getElementById('reset').addEventListener('click', () => f.reset());
  f.addEventListener('x-submit', (e) => (out.textContent = 'submit: ' + JSON.stringify(e.detail.values)));
  f.addEventListener('x-invalid', () => (out.textContent = 'invalid'));
</script>
</body>
</html>
