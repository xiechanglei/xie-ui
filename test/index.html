<!doctype html>
<html data-xie-theme="dark" data-xie-radius="none" data-xie-size="compact" data-xie-shadow="strong">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <script type="module" src="/dist/index.js"></script>
</head>
<body>
<button id="openDrawer">打开抽屉</button>
<x-drawer id="dr1" title="通知设置" subtitle="副标题说明">
    <x-text variant="muted">
        快捷用法：未写 &lt;x-drawer-header&gt;，抽屉自动生成带 show-close 的头部；副标题走 x-text caption。中部内容自动滚动留白。
    </x-text>
</x-drawer>
<script>
    openDrawer.addEventListener('click', () => dr1.show());
    dr1.addEventListener('x-close', () => console.log('x-close 已触发'));
</script>
</body>
</html>
