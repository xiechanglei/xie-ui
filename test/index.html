<!doctype html>
<html data-xie-theme="dark" data-xie-radius="none" data-xie-size="compact" data-xie-shadow="strong">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <script type="module" src="/dist/index.js"></script>
</head>
<body>
<div style="margin-top:16px">
  <button id="openDrawer">打开抽屉</button>
</div>
<x-drawer id="dr1" label="右侧抽屉">
  <x-drawer-header show-close>
    <div style="display:flex;flex-direction:column;gap:2px">
      <span style="font-weight:600">通知设置</span>
      <span style="font-size:12px;color:var(--xie-color-muted)">副标题说明</span>
    </div>
  </x-drawer-header>
  <div>
    <p style="margin:0;color:var(--xie-color-muted);line-height:1.7">header/footer 为独立子组件，与内容之间无分隔线；中部内容自动滚动。右上为 header 的 show-close 关闭按钮。</p>
  </div>
  <x-drawer-footer>
    <x-button id="dcancel">取消</x-button>
    <x-button variant="solid">确定</x-button>
  </x-drawer-footer>
</x-drawer>
<x-drawer id="dr2" label="左侧抽屉" placement="left" width="300px">
  <x-drawer-header>左侧抽屉（无关闭按钮）</x-drawer-header>
  <div><p style="margin:0;color:var(--xie-color-muted)">header 未加 show-close → 无关闭按钮；无 footer。</p></div>
</x-drawer>
<script>
  openDrawer.addEventListener('click', () => dr1.show());
  dcancel.addEventListener('click', () => dr1.hide());
</script>
</body>
</html>
